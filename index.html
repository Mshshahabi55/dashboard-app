<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Dashboard | Complete UX</title>
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                    <span>Pro<span class="highlight">Dash</span></span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item" data-route="dashboard">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#analytics" class="nav-item" data-route="analytics">
                    <i class="fas fa-chart-line"></i>
                    <span>Analytics</span>
                </a>
                <a href="#products" class="nav-item" data-route="products">
                    <i class="fas fa-boxes"></i>
                    <span>Products</span>
                </a>
                <a href="#customers" class="nav-item" data-route="customers">
                    <i class="fas fa-users"></i>
                    <span>Customers</span>
                </a>
                <a href="#settings" class="nav-item" data-route="settings">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <img id="userAvatar" src="https://ui-avatars.com/api/?name=Mohammad+Shahabi&background=4361ee&color=fff&size=40" alt="User">
                    <div class="user-details">
                        <span class="user-name" id="userName">John Doe</span>
                        <span class="user-role" id="userRole">Administrator</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="globalSearch" placeholder="Search products, customers..." class="search-input">
                    </div>
                </div>

                <div class="header-right">
                    <button class="theme-toggle" id="themeToggle">
                        <i class="fas fa-sun"></i>
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="favorites-btn" id="favoritesBtn">
                        <i class="fas fa-heart"></i>
                        <span class="badge" id="favoritesCount">0</span>
                    </button>
                    <div class="notifications-dropdown">
                        <button class="notifications-btn" id="notificationsBtn">
                            <i class="fas fa-bell"></i>
                            <span class="badge" id="notificationsBadge">0</span>
                        </button>
                    </div>
                    <div class="user-menu">
                        <img src="https://ui-avatars.com/api/?name=Mohammad+Shahabi&background=4361ee&color=fff&size=40" alt="User">
                    </div>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <div id="dynamicContent" class="dynamic-content"></div>
        </main>

        <!-- Favorites Sidebar -->
        <div class="favorites-sidebar" id="favoritesSidebar">
            <div class="favorites-header">
                <h3><i class="fas fa-heart" style="color: #f72585;"></i> My Favorites</h3>
                <button class="close-btn" id="closeFavorites">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="favorites-content" id="favoritesContent"></div>
        </div>

        <!-- Overlay -->
        <div class="overlay hidden" id="overlay"></div>

        <!-- Toast Container -->
        <div id="toastContainer" class="toast-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
